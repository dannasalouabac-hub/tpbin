<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="register.css" />
</head>
<body>
  <div class="layout">
    <aside class="brand">
      <p class="brand-name">Mon Espace</p>

      <div class="brand-body">
        <h2 class="brand-title">Bienvenue parmi nous.</h2>
        <p class="brand-text">Créez votre compte pour retrouver vos projets et vos échanges partout.</p>
      </div>
    </aside>

    <main class="form-side">
      <div class="form-wrap">
        <h1>Créer un compte</h1>
        <p class="lead">Quelques informations suffisent pour commencer.</p>

        <div id="alert" class="alert" role="alert" hidden></div>

        <form id="register-form" novalidate>
          <div class="field">
            <label for="name">Nom complet</label>
            <input
              id="name"
              name="name"
              type="text"
              autocomplete="name"
              aria-describedby="name-error"
            />
            <p id="name-error" class="error"></p>
          </div>

          <div class="field">
            <label for="email">Adresse e-mail</label>
            <input
              id="email"
              name="email"
              type="email"
              inputmode="email"
              autocomplete="email"
              spellcheck="false"
              aria-describedby="email-error"
            />
            <p id="email-error" class="error"></p>
          </div>

          <div class="field">
            <label for="password">Mot de passe</label>
            <div class="password-wrap">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                aria-describedby="password-hint password-error"
              />
              <button type="button" class="toggle" data-target="password" aria-controls="password">
                Afficher
              </button>
            </div>
            <p id="password-hint" class="hint">Au moins 8 caractères, avec une lettre et un chiffre.</p>
            <p id="password-error" class="error"></p>
          </div>

          <div class="field">
            <label for="confirm-password">Confirmer le mot de passe</label>
            <div class="password-wrap">
              <input
                id="confirm-password"
                name="confirm-password"
                type="password"
                autocomplete="new-password"
                aria-describedby="confirm-password-error"
              />
              <button
                type="button"
                class="toggle"
                data-target="confirm-password"
                aria-controls="confirm-password"
              >
                Afficher
              </button>
            </div>
            <p id="confirm-password-error" class="error"></p>
          </div>

          <div class="terms">
            <label class="checkbox">
              <input type="checkbox" id="terms" name="terms" aria-describedby="terms-error" />
              <span>J’accepte les <a href="#">conditions d’utilisation</a> et la <a href="#">politique de confidentialité</a>.</span>
            </label>
            <p id="terms-error" class="error"></p>
          </div>

          <button type="submit" class="submit">Créer mon compte</button>
        </form>

        <p class="signup">Vous avez déjà un compte&nbsp;? <a href="connexion.html">Se connecter</a></p>
      </div>
    </main>
  </div>

  <script src="./register.js"></script>
</body>
</html>
